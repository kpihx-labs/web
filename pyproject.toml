[project]
name = "k-web"
version = "2.1.0"
description = "Private CLI for metasearch, verified retrieval, bounded crawling and media investigation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "defusedxml>=0.7.1",
    "fpdf2>=2.8.9",
    "httpx[socks]",
    "lxml",
    "phonenumbers>=9.0.41",
    "picimagesearch",
    "pillow",
    "pypdf",
    "python-docx",
    "regex>=2026.9.29",
    "requests[socks]",
    "rich",
    "typer",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = []

[project.scripts]
web = "k_web.cli:main"

[project.urls]
Repository = "https://github.com/kpihx-labs/web"
GitLab = "https://gitlab.com/kpihx-labs/web"
Issues = "https://github.com/kpihx-labs/web/issues"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k_web"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
]
