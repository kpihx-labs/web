[project]
name = "xsearch"
version = "0.1.0"
description = "Sovereign ultra-flexible multi-network search CLI across Surface Web, Tor .onion, and I2P"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "lxml",
    "requests[socks]",
    "rich",
    "typer",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest"]

[project.scripts]
xsearch = "xsearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
