[project]
name = "xsearch"
version = "1.3.0"
description = "Sovereign ultra-flexible multi-network search, crawl & media audit CLI across Surface Web, Tor .onion, and I2P"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "cssselect",
    "exifread",
    "httpx[socks]",
    "lxml",
    "picimagesearch",
    "pillow",
    "pypdf",
    "pyquery",
    "python-docx",
    "requests[socks]",
    "rich",
    "typer",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest"]

[project.scripts]
xsearch = "xsearch.cli:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xsearch"
