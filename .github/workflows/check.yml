name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Native optional-feature test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh poppler-utils tesseract-ocr fontconfig fonts-dejavu-core
      - run: uv sync
      - run: uv tool install ruff && uv tool install pyright
      - run: make check
      - run: make build
